name: Esporta dettagli EasyEDA Pro
on:
  push:
    branches: [main]
    paths:
      - "MicroWind_V1_REVISED_V2.epro"
      - "tools/export_easyeda.py"
      - ".github/workflows/export-easyeda.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Genera BOM, netlist, geometria e preview
        run: python3 tools/export_easyeda.py MicroWind_V1_REVISED_V2.epro exports
      - name: Estrai file CAD nativi per consultazione e diff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          root = Path("cad_unpacked")
          source = Path("MicroWind_V1_REVISED_V2.epro")
          allowed = {".esch", ".epcb", ".efoo", ".esym"}
          with ZipFile(source) as archive:
              for item in archive.infolist():
                  if item.is_dir():
                      continue
                  relative = Path(item.filename)
                  if relative.is_absolute() or ".." in relative.parts:
                      raise ValueError("Percorso non valido nell'archivio: " + item.filename)
                  if relative.name != "project.json" and relative.suffix not in allowed:
                      continue
                  output = root / relative
                  output.parent.mkdir(parents=True, exist_ok=True)
                  output.write_bytes(archive.read(item))
          print("Estratti", sum(1 for p in root.rglob("*") if p.is_file()), "file EasyEDA")
          PY
      - name: Registra nel repository le esportazioni e i sorgenti esplosi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports cad_unpacked
          if ! git diff --cached --quiet; then
            git commit -m "build: aggiorna esportazioni e contenuto EasyEDA consultabile"
            git push
          fi
